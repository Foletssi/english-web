<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eefaff">
  <title>Eastudy · 登录</title>
  <link rel="icon" type="image/png" href="assets/images/eastudy-icon.png">
  <link rel="stylesheet" href="assets/css/student-login.css?v=beta6.20">
</head>
<body class="student-login-page">
  <main class="auth-shell">
    <section class="auth-brand-panel" aria-label="Eastudy 学习介绍">
      <a class="auth-brand" href="index.html"><img src="assets/images/eastudy-logo.png" alt="Eastudy · Learn English, the Easy Way."></a>
      <div class="auth-brand-copy"><h1>让英语学习<br>变得<span>更简单</span></h1><p>用更轻松的方式，<br>打开更大的世界。</p><i></i><small>A BRIGHTER YOU<br>A WIDER WORLD</small></div>
      <div class="auth-scene" aria-hidden="true"><span class="scene-arch"></span><span class="scene-clock">London</span><span class="scene-globe">◌</span><span class="scene-book book-one">A Brighter You</span><span class="scene-book book-two">A Wider World</span></div>
    </section>
    <section class="auth-panel" aria-labelledby="authTitle">
      <div class="auth-panel-note"><i></i>更好的你，从一口流利的英语开始</div>
      <div class="auth-card">
        <div class="auth-tabs" role="tablist" aria-label="账户操作"><button class="auth-tab active" type="button" data-auth-mode="signin" role="tab" aria-selected="true">登录</button><button class="auth-tab" type="button" data-auth-mode="signup" role="tab" aria-selected="false">注册</button></div>
        <div class="auth-form-view" id="authFormView"><h2 id="authTitle">登录</h2><p class="auth-description" id="authDescription">使用手机号和密码登录你的学生账户。</p>
          <form id="student-login-form" novalidate>
            <label class="auth-field" id="studentNameWrap" hidden><span>昵称</span><input id="studentName" type="text" autocomplete="nickname" placeholder="请输入昵称"></label>
            <label class="auth-field"><span>手机号</span><div class="auth-input-wrap"><b aria-hidden="true">⌕</b><input id="studentPhone" type="tel" autocomplete="username" inputmode="tel" placeholder="请输入手机号" required></div></label>
            <div class="auth-methods" role="tablist" aria-label="登录方式"><button type="button" class="auth-method" data-login-method="code" role="tab" aria-selected="false">验证码登录</button><button type="button" class="auth-method active" data-login-method="password" role="tab" aria-selected="true">密码登录</button></div>
            <label class="auth-field" id="passwordField"><span>密码</span><div class="auth-input-wrap"><b aria-hidden="true">▢</b><input id="studentPassword" type="password" autocomplete="current-password" minlength="6" placeholder="请输入密码" required><button class="password-toggle" type="button" id="passwordToggle" aria-label="显示密码">◉</button></div></label>
            <div class="auth-code-row" id="codeRow" hidden><label class="auth-field"><span>验证码</span><div class="auth-input-wrap"><b aria-hidden="true">✓</b><input id="studentCode" type="text" inputmode="numeric" placeholder="请输入验证码"></div></label><button type="button" class="code-button" id="codeButton" disabled>获取验证码</button></div>
            <button type="button" class="forgot-link" id="forgotPassword">忘记密码？</button><p class="auth-message" id="studentLoginMessage" role="status" aria-live="polite"></p><button class="auth-submit" type="submit" id="studentLoginSubmit">登录</button>
          </form>
        </div>
        <section class="auth-success-view" id="authSuccessView" hidden><div class="success-logo"><img src="assets/images/eastudy-logo.png" alt="Eastudy"></div><div class="success-check" aria-hidden="true">✓</div><h2>注册<span>成功</span></h2><p>欢迎加入 Eastudy，开启你的英语学习之旅。</p><button class="auth-submit" type="button" id="successLoginButton">去登录</button><button class="success-later" type="button" id="successLaterButton">稍后再说　›</button></section>
      </div><p class="auth-footer">EASTUDY　·　LEARN ENGLISH, THE EASY WAY.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared/supabase-config.js?v=beta6.20"></script><script src="shared/supabase-client.js?v=beta6.20"></script><script src="assets/js/student-login.js?v=beta6.20"></script>
</body>
</html>
